name: Report gallery feedback
description: Tell us when a checked report example is confusing, stale, or missing useful context.
title: "[Report gallery]: "
labels:
  - docs
body:
  - type: markdown
    attributes:
      value: |
        Use this when one of the checked report examples does not match what you saw, or when the output is hard to interpret.

        Do not paste secrets, private repository code, customer data, full CI logs, or unredacted paths. If the report involves a vulnerability, credential exposure, command execution risk, private code disclosure, package publishing, or MCP data exposure, use `SECURITY.md` instead of a public issue.

        Helpful public-safe commands:

        ```powershell
        npx -y memento-mori-jester@latest doctor --json
        npx -y memento-mori-jester@latest summary --kind command "git reset --hard"
        ```
  - type: input
    id: version
    attributes:
      label: Jester version
      description: Paste the package version from `jester doctor`, or say `latest`.
      placeholder: "0.1.89"
    validations:
      required: true
  - type: dropdown
    id: gallery-example
    attributes:
      label: Nearest report gallery example
      description: Which checked example is closest to what surprised you?
      options:
        - fresh-install-doctor
        - destructive-command-summary
        - blocked-command-review
        - none of these
    validations:
      required: true
  - type: textarea
    id: command-summary
    attributes:
      label: Sanitized command summary
      description: Paste the smallest command or workflow step needed to understand the report. Redact private paths and values.
      render: shell
    validations:
      required: true
  - type: textarea
    id: output-summary
    attributes:
      label: Sanitized output summary
      description: Paste only the relevant Jester lines, for example verdict, rule id, and suggested next command. Do not paste full logs.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: Say what would have made the report clearer or more useful.
    validations:
      required: true
  - type: textarea
    id: doctor-json
    attributes:
      label: doctor --json output
      description: Paste redacted `jester doctor --json` output if it helps explain the environment.
      render: json
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed secrets, tokens, private code, private paths, customer data, and full CI logs from this report.
          required: true
        - label: I used the latest published package or local `main` build.
          required: false

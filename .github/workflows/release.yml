name: GitHub Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          notes_file="docs/RELEASE_NOTES_${TAG}.md"

          if [ -f "$notes_file" ]; then
            gh release create "$TAG" --title "$TAG" --notes-file "$notes_file" --latest
          else
            gh release create "$TAG" --title "$TAG" --generate-notes --latest
          fi

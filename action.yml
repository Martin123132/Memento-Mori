name: Memento Mori Jester
description: Review a GitHub Actions diff with the Memento Mori Jester.

inputs:
  fail-on:
    description: Verdict threshold that fails the workflow.
    required: false
    default: block
  subject:
    description: Human-readable subject passed to the review.
    required: false
    default: GitHub Actions diff
  config:
    description: Optional path to a jester config file.
    required: false
    default: ""
  no-config:
    description: Ignore discovered jester.config.json files.
    required: false
    default: "false"
  format:
    description: Output format for the review. Use text or sarif.
    required: false
    default: text
  output-file:
    description: Optional file path to write review output, useful for SARIF upload steps.
    required: false
    default: ""
  summary:
    description: Append a human-readable review summary to the GitHub Actions job summary.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Build Jester
      shell: bash
      run: |
        cd "$GITHUB_ACTION_PATH"
        npm ci
        npm run build

    - name: Review Diff
      shell: bash
      env:
        FAIL_ON: ${{ inputs.fail-on }}
        SUBJECT: ${{ inputs.subject }}
        CONFIG: ${{ inputs.config }}
        NO_CONFIG: ${{ inputs.no-config }}
        FORMAT: ${{ inputs.format }}
        OUTPUT_FILE: ${{ inputs.output-file }}
        SUMMARY: ${{ inputs.summary }}
      run: |
        set -euo pipefail

        if [ "$SUMMARY" != "true" ] && [ "$SUMMARY" != "false" ]; then
          echo "Unknown summary: $SUMMARY. Use true or false." >&2
          exit 1
        fi

        args=(diff --fail-on "$FAIL_ON" --subject "$SUBJECT")
        summary_args=(summary --subject "$SUBJECT")
        if [ -n "$CONFIG" ]; then
          args+=(--config "$CONFIG")
          summary_args+=(--config "$CONFIG")
        fi
        if [ "$NO_CONFIG" = "true" ]; then
          args+=(--no-config)
          summary_args+=(--no-config)
        fi
        if [ "$FORMAT" = "sarif" ]; then
          args+=(--sarif)
        elif [ "$FORMAT" != "text" ]; then
          echo "Unknown format: $FORMAT. Use text or sarif." >&2
          exit 1
        fi

        diff_file="$(mktemp)"
        trap 'rm -f "$diff_file"' EXIT

        if [ -n "${GITHUB_BASE_REF:-}" ]; then
          git fetch origin "$GITHUB_BASE_REF" --depth=1
          git diff --binary --no-ext-diff "origin/$GITHUB_BASE_REF...HEAD" > "$diff_file"
        else
          git diff --binary --no-ext-diff HEAD~1..HEAD > "$diff_file"
        fi

        review_status=0
        if [ -n "$OUTPUT_FILE" ]; then
          node "$GITHUB_ACTION_PATH/dist/cli.js" "${args[@]}" < "$diff_file" > "$OUTPUT_FILE" || review_status=$?
        else
          node "$GITHUB_ACTION_PATH/dist/cli.js" "${args[@]}" < "$diff_file" || review_status=$?
        fi

        if [ "$SUMMARY" = "true" ] && [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          if ! {
            echo "## Memento Mori Jester"
            echo
            node "$GITHUB_ACTION_PATH/dist/cli.js" "${summary_args[@]}" < "$diff_file"
          } >> "$GITHUB_STEP_SUMMARY"; then
            echo "Failed to append Jester summary; keeping review status $review_status." >&2
          fi
        fi

        exit "$review_status"

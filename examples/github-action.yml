name: Jester Review

on:
  pull_request:
    branches: [main]

jobs:
  jester:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Review pull request diff
        uses: Martin123132/Memento-Mori@main
        with:
          fail-on: block
          subject: pull request diff
          summary: true
